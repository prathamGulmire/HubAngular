<h2>Profile</h2>

<div class="content-block dx-card responsive-paddings">
  <div class="form-avatar">
    <img [src]="imageUrl" />
  </div>
  <h4 *ngIf="student">Hi, this is {{student.firstName}} 😊</h4>
</div>

<div class="content-block dx-card responsive-paddings">
  <dx-form
    id="form"
    [formData]="student"
    labelLocation="top"
    [colCountByScreen]="colCountByScreen"
    [readOnly]="true">

    <dxi-item 
      dataField="firstName">
    </dxi-item>

    <dxi-item
      dataField="lastName">
    </dxi-item>

    <dxi-item
      dataField="middleName">
    </dxi-item>

    <dxi-item
      dataField="DepartmentName">
      <dx-text-box [value]="departmentName" [readOnly]="true"></dx-text-box>
    </dxi-item>

    <dxi-item
      dataField="dateOfBirth"
      editorType="dxDateBox"
      [editorOptions]="{
        type: 'date',
        displayFormat: 'dd/MM/yyyy',
        dateSerializationFormat: 'yyyy-MM-dd'
      }">
    </dxi-item>

    <dxi-item
      dataField="email">
    </dxi-item>

    <dxi-item
      dataField="gender">
    </dxi-item>

    <dxi-item 
      dataField="address">
    </dxi-item>

    <dxi-item 
      dataField="state">
    </dxi-item>

    <dxi-item
      dataField="country">
    </dxi-item>

    <dxi-item
      dataField="pincode">
    </dxi-item>

    <dxi-item 
      dataField="role">
    </dxi-item>

    <dxi-item 
      dataField="isActive">
    </dxi-item>

  </dx-form>
</div>
